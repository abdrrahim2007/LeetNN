{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetNN – Categories</title>

  
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" type="text/css" href="{% static 'base/css/category.css' %}">

  <style>
    
    .cat-t {
      overflow: hidden;
      transition: all 0.35s ease-in-out;
      max-height: 0;
      opacity: 0;
    }
    .cat.open .cat-t,.cat:hover .cat-t {
      max-height: 500px; 
      opacity: 1;
    }
  </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-10">

  <h1 class="text-3xl md:text-4xl font-bold mb-10 text-blue-400 tracking-tight">
    categories
  </h1>

  <div class="flex flex-wrap justify-center gap-6 max-w-6xl w-full">

    {% for category in categories%}
    <div class="cat w-80 bg-gray-800 rounded-2xl p-6 shadow-md cursor-pointer hover:shadow-lg transition-all">
      <h2 class="text-2xl font-semibold text-center border-b border-gray-600 pb-3">
        {{ category.title }}
      </h2>

      <div class="cat-t flex flex-wrap justify-center items-center gap-3 pt-4">

        {% for course in category.courses.all %}
        <a class="text-blue-300 hover:text-blue-400 transition" href="{% url 'course_view_new' cat=category.slug course_slug=course.slug %}">{{course.title}}</a>
        {% endfor %}
      </div>
    </div>

    {% endfor %}



  </div>

  <script>
    const cats = document.querySelectorAll(".cat");

    cats.forEach(cat => {
      const header = cat.querySelector("h2");

      header.addEventListener("click", () => {
        const isOpen = cat.classList.contains("open");

        
        cats.forEach(other => other.classList.remove("open"));

        
        if (!isOpen) cat.classList.add("open");
      });
    });
  </script>
</body>
</html>
