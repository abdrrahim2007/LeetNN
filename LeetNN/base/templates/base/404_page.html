{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 - Page Not Found</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <link rel="stylesheet" type="text/css" href="{% static 'base/css/404_page.css' %}">
  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .float {
      animation: float 3s ease-in-out infinite;
    }
    .glow {
      box-shadow: 0 0 15px rgba(59,130,246,0.5);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white">

  <div class="text-center px-6">
    <h1 class="text-9xl font-extrabold text-blue-500 float">404</h1>
    <h2 class="mt-4 text-3xl font-semibold">Oops! Page Not Found</h2>
    <p class="mt-3 text-gray-400 text-lg max-w-md mx-auto">
      The page you’re looking for doesn’t exist or has been moved.  
      Let’s get you back on track.
    </p>

    <div class="mt-8">
      <a href="{% url 'home' %}" 
         class="inline-block bg-blue-600 hover:bg-blue-700 glow text-white px-6 py-3 rounded-full font-semibold transition-transform transform hover:scale-105">
        ⬅ Back to Home
      </a>
    </div>

    <div class="mt-12 text-sm text-gray-500">
      &copy; <span id="year"></span> LeetNN. All rights reserved.
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
