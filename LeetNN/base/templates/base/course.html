{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReMarked</title>
  <link rel="stylesheet" type="text/css" href="{% static 'base/Remarked/main.css' %}">
  <!-- Highlight.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

 

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script>hljs.highlightAll();</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
  

  <!-- Header with Mobile Toggle -->
  <header class="app-header">
    <button
      class="menu-btn"
      id="menu-toggle-btn"
      aria-controls="sidebar"
      aria-expanded="false"
      aria-label="Toggle navigation menu"
    >
      &#9776; <!-- Hamburger Icon -->
    </button>
    <div class="app-title">

<button class="button-back" onclick="history.back()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M15 19l-7-7 7-7"/>
  </svg>
  {{course}}
</button>
</div>
  </header>

  <!-- Sidebar (Navigation) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Chapters</h2>
     
       
     
      <!-- NEW: AI Features Section -->
     <!--  <div class="AI-features">
        <h3>AI Features</h3>
        <button class="AI-btn" id="summarize-btn" disabled>
          <span class="sparkle">✨</span> Summarize
        </button>
        <button class="AI-btn" id="qa-btn" disabled>
          <span class="sparkle">✨</span> Generate Q&A
        </button>
      </div>
    </div> -->

    <!-- Accordion Navigation -->
    <nav class="sidebar-nav" aria-label="Main Navigation">
     
      {% for chapter in chapters %}

      <details class="nav-section" >
        <summary class="nav-section-title">{{ chapter }}</summary>
        <ul class="nav-links">
              {% if chapter.section_ids %}
               {% for part in chapter.section_ids %}

          <li>
            <a href="{% url 'chapter_view' dep=course.department.slug course_slug=course.slug chapter_slug=chapter.slug %}#{{ part }}">
    {{ part }}
</a>

          </li>
          {% endfor %}
          {% endif %}
        </ul>
      </details>

      {% endfor %}
   

    </nav>
  </aside>

  
  <main class="content-area" id="preview">
  <!-- Loading container -->
  <div id="loading" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; color:#333;">
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p style="margin-top:10px;">Loading content, please wait...</p>
  </div>
</main>

 
  <!-- Overlay for mobile menu -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- NEW: Modal for AI Results -->
  <div class="modal-overlay" id="AI-modal-overlay">
    <div class="modal" id="AI-modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <header class="modal-header">
        <h2 class="modal-title" id="modal-title">AI Result</h2>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Close modal">&times;</button>
      </header>
      <section class="modal-body" id="modal-body">
        <!-- Content will be injected here -->
        <div class="loader"></div>
      </section>
    </div>
  </div>




  <script type="text/javascript">
    var file_link = '{{chapter_c.file.url}}'
  </script>
  <script src="{% static 'base/Remarked/parser/main.js' %}"></script>


</body>
</html>
