{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LeetNN Library</title>
  <meta name="description" content="Browse & download eBooks (PDF, EPUB, MOBI)" />
  <link rel="stylesheet" type="text/css" href="{% static 'base/css/library.css' %}">
  
  <style>
    .card-lift { transition: transform .18s ease, box-shadow .18s ease; }
    .card-lift:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(15,23,42,0.12); }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 bg-white/90 backdrop-blur z-20 border-b">
    <div class="max-w-7xl mx-auto p-4 flex flex-col md:flex-row gap-4 md:items-center">
      <h1 class="text-2xl font-semibold text-indigo-600 flex-shrink-0">LeetNN Library</h1>

      <!-- Search -->
      <div class="flex-1 w-full">
        <label for="search" class="sr-only">Search books</label>
        <input id="search" type="search" placeholder="Search title, author..." name="search_q" aria-label="Search books"
               class="w-full rounded-2xl border p-2 px-4 focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-2 items-center">
        <select id="filter-category" aria-label="Filter by category" class="rounded-xl border p-2 min-w-[120px]">
          <option value="">All Categories</option>
        </select>
        <select id="filter-format" aria-label="Filter by format" class="rounded-xl border p-2 min-w-[100px]">
          <option value="">All Formats</option>
        </select>
        <select id="filter-year" aria-label="Filter by year" class="rounded-xl border p-2 min-w-[80px]">
          <option value="">All Years</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto p-6 w-full">
    <section id="grid" class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      <!-- Book cards appended here -->
    </section>

    <!-- Loading -->
    <div id="loading" class="mt-8 text-center hidden">
      <svg class="mx-auto h-8 w-8 animate-spin" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" opacity="0.25"></circle>
        <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"></path>
      </svg>
      <p class="text-sm mt-2">Loading more books...</p>
    </div>

    <!-- End of list -->
    <div id="end-of-list" class="mt-8 text-center text-sm text-gray-500 hidden">No more books.</div>
  </main>

  <!-- Footer -->
  <footer class="border-t py-6 mt-12 bg-white">
    <div class="max-w-7xl mx-auto text-center text-sm text-gray-500">© 2025 <a class="text-blue-400 text-xl" href="{% url 'home' %}">LeetNN</a>. All rights reserved.</div>
  </footer>

  <!-- Book card template -->
  <template id="book-card-template">
    <article class="card-lift bg-white rounded-2xl p-4 shadow-sm border focus-within:ring-2 focus-within:ring-indigo-200" tabindex="0">
      <div class="h-48 sm:h-56 md:h-48 bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center">
        <img class="object-cover w-full h-full" alt="Book thumbnail" loading="lazy" />
      </div>
      <h3 class="mt-3 text-sm font-semibold line-clamp-2">Title</h3>
      <p class="text-xs text-gray-500">Author</p>
      <div class="mt-3 flex items-center justify-between flex-wrap gap-2">
        <span class="format-badge text-xs px-2 py-1 rounded-full border text-gray-600">PDF</span>
        <a class="download-btn inline-flex items-center gap-2 text-xs font-medium rounded-full px-3 py-1 border focus:outline-none" rel="noopener" target="_blank">Download</a>
      </div>
    </article>
  </template>

   
  <script>// ==============================
// Configuration
// ==============================
const CONFIG = {
  BOOKS_ENDPOINT: '/api/library/', // expects ?page=n&search=&category=&format=&year=
  FILTERS_ENDPOINT: '/api/library/filters/',
  BATCH_SIZE: 12
};

// ==============================
// State
// ==============================
let page = 1;
let loading = false;
let finished = false;
let searchTerm = '';
let selectedCategory = '';
let selectedFormat = '';
let selectedYear = '';

// ==============================
// Elements
// ==============================
const urlParams = new URLSearchParams(window.location.search);
searchTerm = urlParams.get('search_q') || '';

const searchInput = document.getElementById('search');
searchInput.value = searchTerm;

const grid = document.getElementById('grid');
const loadingEl = document.getElementById('loading');
const endEl = document.getElementById('end-of-list');

const categorySelect = document.getElementById('filter-category');
const formatSelect = document.getElementById('filter-format');
const yearSelect = document.getElementById('filter-year');

// ==============================
// Helpers
// ==============================
function debounce(fn, wait = 300) {
  let timeout;
  return (...args) => {
    clearTimeout(timeout);
    timeout = setTimeout(() => fn(...args), wait);
  };
}

function populateSelect(id, items) {
  const select = document.getElementById(id);
  if (!select || !items) return;

  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    select.appendChild(opt);
  });
}

// ==============================
// Render Functions
// ==============================
function renderBook(book) {
  const tpl = document.getElementById('book-card-template');
  const node = tpl.content.cloneNode(true);

  const article = node.querySelector('article');
  const img = node.querySelector('img');
  const title = node.querySelector('h3');
  const author = node.querySelector('p');
  const badge = node.querySelector('.format-badge');
  const download = node.querySelector('.download-btn');

  img.src = book.thumbnail_url || 'https://png.pngtree.com/png-vector/20221125/ourmid/pngtree-no-image-available-icon-flatvector-illustration-picture-coming-creative-vector-png-image_40968940.jpg';
  img.alt = `${book.title || 'Book'} thumbnail`;
  
  title.textContent = book.title || 'Untitled';
  author.textContent = book.author || 'Unknown author';
  badge.textContent = book.format || '';
  
  download.href = book.file_url || book.download_url || '#';
  download.textContent = 'Download';
  
  if (book.format) {
    download.setAttribute('aria-label', `Download ${book.title} (${book.format})`);
  }

  grid.appendChild(node);
}

// ==============================
// Data Fetching
// ==============================
async function loadFilters() {
  try {
    const res = await fetch(CONFIG.FILTERS_ENDPOINT);
    if (!res.ok) return;

    const data = await res.json();
    populateSelect('filter-category', data.categories || []);
    populateSelect('filter-year', data.years || []);
  } catch (e) {
    console.warn('Could not load filters', e);
  }
}

async function loadBooks() {
  if (loading || finished) return;
  loading = true;
  loadingEl.classList.remove('hidden');

  try {
    const params = new URLSearchParams({ page, page_size: CONFIG.BATCH_SIZE });
    if (searchTerm) params.set('search', searchTerm);
    if (selectedCategory) params.set('category', selectedCategory);
    if (selectedFormat) params.set('format', selectedFormat);
    if (selectedYear) params.set('year', selectedYear);

const res = await fetch(`${CONFIG.BOOKS_ENDPOINT}?${params.toString()}`);

if (res.status === 404) {
  // no more pages
  finished = true;
  endEl.classList.remove('hidden');
  loadingEl.classList.add('hidden');
  return;
}

if (!res.ok) throw new Error('Network response not ok');

const payload = await res.json();
const books = payload.results || payload;

if (!books.length) {
  finished = true;
  endEl.classList.remove('hidden');
} else {
  books.forEach(renderBook);
  page += 1;
  if (!payload.next) finished = true; // mark finished if no next page
}

  } catch (err) {
    console.error(err);
    const msg = document.createElement('p');
    msg.className = 'text-sm text-red-500 mt-4';
    msg.textContent = 'Could not load books. Please try again later.';
    grid.after(msg);
    finished = true;
  } finally {
    loading = false;
    loadingEl.classList.add('hidden');
  }
}

// ==============================
// Reset
// ==============================
function resetAndLoad() {
  page = 1;
  finished = false;
  grid.innerHTML = '';
  endEl.classList.add('hidden');
  loadBooks();
}

// ==============================
// Infinite Scroll
// ==============================
const sentinel = document.createElement('div');
sentinel.dataset.sentinel = 'true';
document.body.appendChild(sentinel);

const io = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting && !loading && !finished) {
      loadBooks();
    }
  });
}, { root: null, rootMargin: '200px', threshold: 0.01 });

io.observe(sentinel);

// ==============================
// Event Listeners
// ==============================
searchInput.addEventListener('input', debounce(e => {
  searchTerm = e.target.value.trim();
  resetAndLoad();
}, 400));

[categorySelect, formatSelect, yearSelect].forEach(el => {
  el.addEventListener('change', () => {
    selectedCategory = categorySelect.value;
    selectedFormat = formatSelect.value;
    selectedYear = yearSelect.value;
    resetAndLoad();
  });
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const cards = Array.from(grid.querySelectorAll('article'));
    if (!cards.length) return;
    const idx = cards.indexOf(document.activeElement);
    const next = idx === -1 ? 0 : (e.key === 'ArrowRight' ? Math.min(cards.length - 1, idx + 1) : Math.max(0, idx - 1));
    cards[next].focus();
  }
});

// ==============================
// Initialization
// ==============================
(async function init() {
  await loadFilters();
  loadBooks();
})();

  </script>
</body>
</html>
