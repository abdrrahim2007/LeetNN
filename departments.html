<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetNN – Departments</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <style>
    
    .dep-t {
      overflow: hidden;
      transition: all 0.35s ease-in-out;
      max-height: 0;
      opacity: 0;
    }
    .dep.open .dep-t,.dep:hover .dep-t {
      max-height: 500px; 
      opacity: 1;
    }
  </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-10">

  <h1 class="text-3xl md:text-4xl font-bold mb-10 text-blue-400 tracking-tight">
    Departments
  </h1>

  <div class="flex flex-wrap justify-center gap-6 max-w-6xl w-full">

    <!-- Department Card -->
    <div class="dep w-80 bg-gray-800 rounded-2xl p-6 shadow-md cursor-pointer hover:shadow-lg transition-all">
      <h2 class="text-2xl font-semibold text-center border-b border-gray-600 pb-3">
        Math
      </h2>

      <div class="dep-t flex flex-wrap justify-center items-center gap-3 pt-4">
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Python</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Algebra</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Geometry</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Statistics</a>
      </div>
    </div>

    <!-- Department Card -->
    <div class="dep w-80 bg-gray-800 rounded-2xl p-6 shadow-md cursor-pointer hover:shadow-lg transition-all">
      <h2 class="text-2xl font-semibold text-center border-b border-gray-600 pb-3">
        Physics
      </h2>

      <div class="dep-t flex flex-wrap justify-center items-center gap-3 pt-4">
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Mechanics</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Thermodynamics</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Quantum</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Optics</a>
      </div>
    </div>

    <!-- Department Card -->
    <div class="dep w-80 bg-gray-800 rounded-2xl p-6 shadow-md cursor-pointer hover:shadow-lg transition-all">
      <h2 class="text-2xl font-semibold text-center border-b border-gray-600 pb-3">
        Computer Science
      </h2>

      <div class="dep-t flex flex-wrap justify-center items-center gap-3 pt-4">
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">AI</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Machine Learning</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Data Science</a>
        <a class="text-blue-300 hover:text-blue-400 transition" href="#">Programming</a>
      </div>
    </div>

  </div>

  <script>
    const deps = document.querySelectorAll(".dep");

    deps.forEach(dep => {
      const header = dep.querySelector("h2");

      header.addEventListener("click", () => {
        const isOpen = dep.classList.contains("open");

        
        deps.forEach(other => other.classList.remove("open"));

        
        if (!isOpen) dep.classList.add("open");
      });
    });
  </script>
</body>
</html>
